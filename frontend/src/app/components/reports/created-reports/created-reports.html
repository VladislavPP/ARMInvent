<div class="content">

  <h1 class="text-center" style="color:white;">Перелік сформованих звітів</h1>

  <table class="table table-striped table-hover table-dark">
    <thead>
    <tr>
      <th scope="col" style="width: 25%">
        Дата ствоерння
      </th>
      <th scope="col" style="width: 65%">Найменування звіту</th>
      <th scope="col" style="width: 10%">Дії</th>
    </tr>

    <!--SEARCH-->
    <tr>
      <th scope="col">
        <div class="search__form">
          <h6>Дата генерації звіту</h6>
          <div style="display: inline">
            <input class="text-field__input web__search" id="date" type="date" value="{{datePlaceholder}}" (change)="OnDateChange()"/> <!--value="2017-06-01"-->
          </div>
          <div style="position:relative; top: -35px; left: 200px">
            <button style="background-color: silver">
              <svg class="icon-1" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20" (click)="searchRows('DateLibraryReports')">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
              </svg>
            </button>
            <button style="background-color: silver">
              <svg class="icon-2" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20" (click)="searchRows('dumping')">
                <path d="M11.46.146A.5.5 0 0 0 11.107 0H4.893a.5.5 0 0 0-.353.146L.146 4.54A.5.5 0 0 0 0 4.893v6.214a.5.5 0 0 0 .146.353l4.394 4.394a.5.5 0 0 0 .353.146h6.214a.5.5 0 0 0 .353-.146l4.394-4.394a.5.5 0 0 0 .146-.353V4.893a.5.5 0 0 0-.146-.353L11.46.146zm-6.106 4.5L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 1 1 .708-.708z"/>
              </svg>
            </button>
          </div>
        </div>
      </th>

      <th scope="col" style="vertical-align: top; padding-left: -50px">

      </th>
      <th scope="col"></th>
    </tr>
    </thead>

    <!--FILLING-->
    <tbody class="table table-dark">
    <tr class="row-hover" *ngFor="let libraryReport of libraryReports | search: this.searchCondition | paginate: {
                                                                                                itemsPerPage: tableSize,
                                                                                                currentPage: page,
                                                                                                totalItems: count
    }">
      <td>{{libraryReport.date | dateForReportView}}</td>
      <td>{{libraryReport.name_report}}</td>
      <td>

        <!--ЗАВАНТАЖЕННЯ-->
        <a href="{{libraryReport.name_report_to_url}}" download="">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-layer-backward button-actions-download" viewBox="0 0 16 16">
            <path d="M8.354 15.854a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 0-.708l1-1a.5.5 0 0 1 .708 0l.646.647V4H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9v7.793l.646-.647a.5.5 0 0 1 .708 0l1 1a.5.5 0 0 1 0 .708z"/>
            <path d="M1 9a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4.5a.5.5 0 0 1 0 1H1v2h4.5a.5.5 0 0 1 0 1zm9.5 0a.5.5 0 0 1 0-1H15V6h-4.5a.5.5 0 0 1 0-1H15a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1z"/>
          </svg>
        </a>

        <button class='button-actions-delete' (click)="deleteReport(libraryReport.id)">
          <svg (click)="deleteReport(libraryReport.id)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-file-earmark-x button-actions-delete" viewBox="0 0 16 16">
            <path d="M6.854 7.146a.5.5 0 1 0-.708.708L7.293 9l-1.147 1.146a.5.5 0 0 0 .708.708L8 9.707l1.146 1.147a.5.5 0 0 0 .708-.708L8.707 9l1.147-1.146a.5.5 0 0 0-.708-.708L8 8.293z"/>
            <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
          </svg>
        </button>
      </td>
    </tr>
    </tbody>
  </table>

  <!--PAGINATION-->
  <div class="d-flex justify-content-center footer">
    <pagination-controls
      previousLabel="Попередня"
      nextLabel="Наступна"
      (pageChange)="onTableDataChange($event)">
    </pagination-controls>
  </div>
</div>
