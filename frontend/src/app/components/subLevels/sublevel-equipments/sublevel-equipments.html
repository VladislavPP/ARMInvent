  <table class="table table-striped table-hover table-dark" style="position: relative;">
    <thead>

    <!--SEARCH-->
    <tr>
      <th scope="col" colspan="4">
        <div class="search__form">
          <input class="web__search" type="text" placeholder="Значення пошуку" name="name" [(ngModel)]="this.searchValue">
          <svg class="icon-1" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" (click)="searchRows('dumping')">
            <path d="M11.46.146A.5.5 0 0 0 11.107 0H4.893a.5.5 0 0 0-.353.146L.146 4.54A.5.5 0 0 0 0 4.893v6.214a.5.5 0 0 0 .146.353l4.394 4.394a.5.5 0 0 0 .353.146h6.214a.5.5 0 0 0 .353-.146l4.394-4.394a.5.5 0 0 0 .146-.353V4.893a.5.5 0 0 0-.146-.353L11.46.146zm-6.106 4.5L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 1 1 .708-.708z"/>
          </svg>
          <svg class="icon-2" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" (click)="searchRows('searchValue')">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
          </svg>
        </div>
      </th>
    </tr>

    <!--SORT-->
    <tr>
      <th scope="col" style="width: 45%">
        Найменування
      </th>

      <th scope="col" style="width: 20%">
        Інвентарний номер
      </th>

      <th scope="col" style="width: 20%">
        Серійний номер
      </th>
      <th></th>
    </tr>
    </thead>

    <!--FILLING-->
    <tbody class="table table-dark">
    @for (equipment of equipments() | search: searchCondition | paginate: {
      itemsPerPage: tableSize,
      currentPage: page,
      totalItems: count
    }; track equipment.id){
    <tr>
      <td>{{equipment.title}}</td>
      <td>{{equipment.invent_n}}</td>
      <td>{{equipment.serial_n}}</td>
      <td>
        <!--ПЕРЕДАЧА-->
        <button class='button-actions' (click)="transferEquipment(equipment.id)">
          <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-arrow-down-up" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M11 3.5a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5z"/>
            <path fill-rule="evenodd" d="M10.646 2.646a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L11 3.707 8.354 6.354a.5.5 0 1 1-.708-.708l3-3zm-9 7a.5.5 0 0 1 .708 0L5 12.293l2.646-2.647a.5.5 0 1 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 0-.708z"/>
            <path fill-rule="evenodd" d="M5 2.5a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-1 0V3a.5.5 0 0 1 .5-.5z"/>
          </svg>
        </button>
      </td>
    </tr>
    }
    </tbody>
  </table>

  <!--PAGINATION-->
  <div class="d-flex justify-content-center footer" style="color: white">
    <pagination-controls
      previousLabel="Попередня"
      nextLabel="Наступна"
      (pageChange)="onTableDataChange($event)">
    </pagination-controls>
  </div>
