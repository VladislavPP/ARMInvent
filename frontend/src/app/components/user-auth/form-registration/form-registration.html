<div class="content">
  <div>
    <div class="card">
      <div class="card-body">
        <form [formGroup] = "form">
          <h1 class="text-center" style="color: white">Введіть інформацію про користувача</h1>
          <input type="text" name="login" placeholder="Логін" formControlName="login" style="width: 25%; margin-bottom: 5px">
          <div class="field-message" *ngIf="login.errors">
            <h6 class="input-error">Поле має містити від 5 до 25 символів</h6>
          </div>
          <br>
          <input type="text" name="pass" placeholder="Пароль" formControlName="pass" style="width: 25%; margin-bottom: 5px">
          <div class="field-message" *ngIf="pass.errors">
            <h6 class="input-error">Поле має містити від 5 до 25 символів</h6>
          </div>
          <br>
          <input type="text" name="edrpou" placeholder="ЄДРПОУ/ІПН" formControlName="edrpou" style="width: 10%; margin-bottom: 5px">
          <div class="field-message" *ngIf="edrpou.errors">
            <h6 class="input-error">Поле має містити від 8 до 10 символів, цілі цифри та не мати одне з вже зареєстрованих</h6>
          </div>

          <!--Roles-->
          <h4 class="text-center text-white">Доступні Вам ролі</h4>
          <table class="table table-striped table-hover">
            <thead>
            <tr>
              <th style="width: 5%;"></th>
              <th style="width: 50%">Опис ролі</th>
              <th style="width: 25%">Код ролі</th>
            </tr>
            </thead>

            <tbody>
            <tr class="row-hover" *ngFor="let role of allRoles">
              <td>
                <input type="checkbox" name="{{role.name}}" [checked]="CHBoxView(role.name)" disabled>
              </td>
              <td>{{role.value}}</td>
              <td>{{role.name}}</td>
            </tr>
            </tbody>
          </table>

          <button [disabled]="!form.valid" class="btn btn-dark btn-block" (click)="saveUser()">
            Зберегти
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
