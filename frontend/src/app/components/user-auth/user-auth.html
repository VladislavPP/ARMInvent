<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

<div class="container">
  <div class="row">

    <div class="col-md-offset-3 col-md-6">
      <form class="form-horizontal">
        <span class="heading">АВТОРИЗАЦІЯ</span>
        <div class="form-group">
          <input type="text" class="form-control" name="userLogin" [(ngModel)]="userLogin" placeholder="Логін">
          <i class="fa fa-user"></i>
        </div>
        <div class="form-group help">
          <input [type]="passInputType" class="form-control" name="userLogin" [(ngModel)]="userPass" placeholder="Пароль">
          <i class="fa fa-lock"></i>
          <svg class="icon-pass" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" (click)="changeTypeInputPass()">
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
          </svg>
        </div>
        <div class="form-group">
          <div style="position: absolute; left: 42px">
            <button type="submit" class="btn btn-default" (click)="auth()">САМОРЕЄСТРАЦІЯ</button>
          </div>
          <div>
            <button type="submit" class="btn btn-default" (click)="login()">ВХІД</button>
          </div>
        </div>
      </form>
    </div>

  </div>
</div>
